version: 0.2

# This project validates both Terraform roots, then deploys the selected
# mission pipeline. Lambda image builds invoke it with CDK_ENVIRONMENT and,
# where available, LAMBDA_PIPELINE/TAG for a deterministic image update. ECR
# repositories are resolved from the selected mission's Terraform variables so
# this logic works across all mission pipelines.
env:
  shell: bash
  variables:
    TERRAFORM_VERSION: 1.14.4

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - |
        BANNER_SOURCE=${CODEBUILD_WEBHOOK_TRIGGER:-${CODEBUILD_SOURCE_VERSION:-manual}}
        BANNER_ENVIRONMENT=${CDK_ENVIRONMENT:-${ENVIRONMENT:-}}
        if [ -z "${BANNER_ENVIRONMENT}" ]; then
          case "${BANNER_SOURCE}" in
            tag/*|refs/tags/*) BANNER_ENVIRONMENT=PRODUCTION ;;
            branch/main|main|refs/heads/main) BANNER_ENVIRONMENT=DEVELOPMENT ;;
            pr/*|refs/pull/*|branch/*|refs/heads/*) BANNER_ENVIRONMENT=VALIDATION ;;
            *) BANNER_ENVIRONMENT=UNRESOLVED ;;
          esac
        fi
        BANNER_ENVIRONMENT=$(printf '%s' "${BANNER_ENVIRONMENT}" | tr '[:lower:]' '[:upper:]')
        BANNER_PROJECT=${CODEBUILD_BUILD_ID%%:*}
        BANNER_MISSION=${MISSION:-${MISSION_NAME:-}}
        if [ -z "${BANNER_MISSION}" ]; then
          case "${BANNER_PROJECT}" in
            build_swxsoc_sdc_aws_base_architecture) BANNER_MISSION=swxsoc ;;
            build_sdc_aws_pipeline_architecture) BANNER_MISSION=hermes ;;
            build_*_sdc_aws_pipeline_architecture)
              BANNER_MISSION=${BANNER_PROJECT#build_}
              BANNER_MISSION=${BANNER_MISSION%_sdc_aws_pipeline_architecture}
              ;;
            *) BANNER_MISSION=unresolved ;;
          esac
        fi
        if [ -n "${TAG:-}" ] || [ -n "${LAMBDA_PIPELINE:-}" ]; then
          BANNER_ACTION="deploy ${LAMBDA_PIPELINE:-unknown} Lambda image via Terraform"
        else
          case "${BANNER_ENVIRONMENT}" in
            VALIDATION) BANNER_ACTION='validate Terraform only' ;;
            *) BANNER_ACTION='validate and apply mission Terraform (guarded)' ;;
          esac
        fi
        BANNER_COMMIT=${CODEBUILD_RESOLVED_SOURCE_VERSION:-unknown}
        printf '\n%s\n' '================================================================================'
        printf '  SWxSOC BUILD: MISSION INFRASTRUCTURE\n'
        printf '%s\n' '================================================================================'
        printf '  Environment : %s\n' "${BANNER_ENVIRONMENT}"
        printf '  Mission     : %s\n' "${BANNER_MISSION}"
        printf '  Service     : terraform-deployment\n'
        printf '  Action      : %s\n' "${BANNER_ACTION}"
        printf '  Project     : %s\n' "${BANNER_PROJECT:-local}"
        printf '  Build       : %s\n' "${CODEBUILD_BUILD_NUMBER:-local}"
        printf '  Trigger     : %s\n' "${BANNER_SOURCE}"
        printf '  Source ref  : %s\n' "${CODEBUILD_SOURCE_VERSION:-unknown}"
        printf '  Commit      : %.12s\n' "${BANNER_COMMIT}"
        printf '%s\n\n' '================================================================================'
      - cd "${CODEBUILD_SRC_DIR:-.}"
      - echo "Installing build dependencies"
      - python --version
      - |
        if command -v apt-get > /dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends make graphviz unzip curl ca-certificates jq
        elif command -v dnf > /dev/null 2>&1; then
          dnf install -y make graphviz unzip curl ca-certificates jq
        elif command -v yum > /dev/null 2>&1; then
          yum install -y make graphviz unzip curl ca-certificates jq
        else
          echo "No supported package manager found; expected apt-get, dnf, or yum"
          exit 1
        fi
      - python -m pip install --upgrade pip
      - python -m pip install --no-cache-dir -r requirements.txt
      - curl -fsSL -o /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
      - unzip -oq /tmp/terraform.zip -d /tmp
      - install -m 0755 /tmp/terraform /usr/local/bin/terraform
      - terraform version

  pre_build:
    commands:
      - cd "${CODEBUILD_SRC_DIR:-.}"
      - make tf-smoke
      - make html

  build:
    commands:
      - cd "${CODEBUILD_SRC_DIR:-.}"
      - cd pipeline-infrastructure-terraform
      - terraform init -reconfigure -input=false
      - |
        set -euo pipefail

        TRIGGERED_PIPELINE=$(printf '%s' "${LAMBDA_PIPELINE:-}" | tr '[:lower:]' '[:upper:]')
        REQUESTED_ENVIRONMENT=$(printf '%s' "${CDK_ENVIRONMENT:-}" | tr '[:lower:]' '[:upper:]')
        IS_IMAGE_DEPLOYMENT=false
        IS_DIRECT_TAG_BUILD=false

        # Lambda image projects invoke this build with both TAG and
        # LAMBDA_PIPELINE. Their environment is about the upstream image build,
        # so never infer it from tags in this architecture checkout.
        if [ -n "${TAG:-}" ] || [ -n "${TRIGGERED_PIPELINE}" ]; then
          if [ -z "${TAG:-}" ] || [ -z "${TRIGGERED_PIPELINE}" ]; then
            echo "Image deployments require both TAG and LAMBDA_PIPELINE"
            exit 1
          fi

          IS_IMAGE_DEPLOYMENT=true
          if [ "${TRIGGERED_PIPELINE}" = "EXECUTOR" ] || [ "${TRIGGERED_PIPELINE}" = "ALERT" ]; then
            # Base infrastructure has one intentional `default` workspace; it
            # does not use the mission dev/prod workspace convention.
            DEPLOY_ENV=prod
          else
            case "${REQUESTED_ENVIRONMENT}" in
              DEVELOPMENT)
                DEPLOY_ENV=dev
                ;;
              PRODUCTION)
                DEPLOY_ENV=prod
                ;;
              *)
                echo "Mission image deployments require CDK_ENVIRONMENT=DEVELOPMENT or PRODUCTION"
                exit 1
                ;;
            esac
          fi
        else
          # For builds sourced directly from this repository, prefer CodeBuild
          # webhook/source metadata. A commit's local Git tags are not reliable
          # evidence of which event started a build.
          case "${CODEBUILD_WEBHOOK_TRIGGER:-}" in
            tag/*)
              IS_DIRECT_TAG_BUILD=true
              ;;
            branch/main)
              ;;
            pr/*|branch/*)
              echo "Non-main direct build: validation complete; skipping Terraform apply"
              exit 0
              ;;
            "")
              if [[ "${CODEBUILD_WEBHOOK_HEAD_REF:-}" == refs/tags/* ]]; then
                IS_DIRECT_TAG_BUILD=true
              else
                case "${CODEBUILD_SOURCE_VERSION:-}" in
                  refs/tags/*)
                    IS_DIRECT_TAG_BUILD=true
                    ;;
                  main|refs/heads/main|"")
                    ;;
                  pr/*|refs/pull/*|refs/heads/*)
                    echo "Non-main direct build: validation complete; skipping Terraform apply"
                    exit 0
                    ;;
                  *)
                    echo "Unrecognized direct source version ${CODEBUILD_SOURCE_VERSION:-<empty>}; refusing to apply"
                    exit 1
                    ;;
                esac
              fi
              ;;
            *)
              echo "Unrecognized webhook trigger ${CODEBUILD_WEBHOOK_TRIGGER}; refusing to apply"
              exit 1
              ;;
          esac

          if [ "${IS_DIRECT_TAG_BUILD}" = true ]; then
            DEPLOY_ENV=prod
          else
            case "${REQUESTED_ENVIRONMENT}" in
              ""|DEVELOPMENT)
                DEPLOY_ENV=dev
                ;;
              PRODUCTION)
                DEPLOY_ENV=prod
                ;;
              *)
                echo "CDK_ENVIRONMENT must be DEVELOPMENT or PRODUCTION"
                exit 1
                ;;
            esac
          fi
        fi

        # Image deployments and direct branch builds must run the exact current
        # main commit. A direct tag build is allowed to deploy its tagged source.
        if [ "${IS_DIRECT_TAG_BUILD}" != true ]; then
          git fetch origin main --depth=1
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            if [ "${IS_IMAGE_DEPLOYMENT}" = true ]; then
              echo "Architecture source is not the current main commit; refusing image deployment"
              exit 1
            fi
            echo "Non-current main build: validation complete; skipping Terraform apply"
            exit 0
          fi
        fi

        guard_image_plan() {
          PLAN_FILE="$1"
          TARGET_RESOURCE="$2"
          PLAN_JSON="${PLAN_FILE}.json"

          terraform show -json "${PLAN_FILE}" > "${PLAN_JSON}"

          if jq -e '.resource_changes[]? | select(.mode == "managed") | select(.change.actions | index("delete"))' "${PLAN_JSON}" > /dev/null; then
            echo "Image deployment plan contains a delete or replacement; refusing to apply"
            jq -r '.resource_changes[]? | select(.mode == "managed") | select(.change.actions | index("delete")) | "\(.address): \(.change.actions | join(","))"' "${PLAN_JSON}"
            exit 1
          fi

          UNEXPECTED_CHANGES=$(jq -r --arg target "${TARGET_RESOURCE}" '.resource_changes[]? | select(.mode == "managed") | select(.change.actions != ["no-op"] and .address != $target) | .address' "${PLAN_JSON}")
          if [ -n "${UNEXPECTED_CHANGES}" ]; then
            echo "Image deployment plan contains changes outside ${TARGET_RESOURCE}; refusing to apply"
            printf '%s\n' "${UNEXPECTED_CHANGES}"
            exit 1
          fi
        }

        if [ "${TRIGGERED_PIPELINE}" = "EXECUTOR" ] || [ "${TRIGGERED_PIPELINE}" = "ALERT" ]; then
          cd ../base-infrastructure-terraform
          terraform init -reconfigure -input=false
          terraform workspace select default
          if [ "${TRIGGERED_PIPELINE}" = "EXECUTOR" ]; then
            BASE_TARGET='aws_lambda_function.aws_sdc_executor_lambda_function'
            BASE_IMAGE_VAR="ef_image_tag=${TAG}"
            BASE_PLAN=/tmp/executor-image.tfplan
          else
            BASE_TARGET='aws_lambda_function.aws_sdc_alert_lambda_function'
            BASE_IMAGE_VAR="alert_image_tag=${TAG}"
            BASE_PLAN=/tmp/alert-image.tfplan
          fi
          terraform plan \
            -lock-timeout=10m \
            -input=false \
            -out="${BASE_PLAN}" \
            -target="${BASE_TARGET}" \
            -var="${BASE_IMAGE_VAR}"
          guard_image_plan "${BASE_PLAN}" "${BASE_TARGET}"
          terraform apply -lock-timeout=10m -input=false -auto-approve "${BASE_PLAN}"
          exit 0
        fi

        # Lambda build projects historically used MISSION_NAME, while this
        # project used MISSION. Accept both names so image builds can trigger a
        # Terraform deployment without relying on project-level defaults.
        MISSION="${MISSION:-${MISSION_NAME:-}}"
        if [ -z "${MISSION}" ]; then
          echo "MISSION (or MISSION_NAME) is required, for example hermes, padre, or swxsoc_pipeline"
          exit 1
        fi

        TFVARS="${TFVARS:-${MISSION}.tfvars}"
        if [ ! -f "${TFVARS}" ]; then
          echo "Mission tfvars file not found: ${TFVARS}"
          exit 1
        fi

        WORKSPACE="${DEPLOY_ENV}-${MISSION}"
        echo "Selecting existing workspace ${WORKSPACE}"
        terraform workspace select "${WORKSPACE}"

        tf_value() {
          VALUE=$(printf '%s\n' "$1" | terraform console -var-file="${TFVARS}")
          printf '%s\n' "${VALUE}" | sed -e 's/\r$//' -e 's/^"//' -e 's/"$//'
        }

        REGION=$(tf_value 'var.deployment_region')
        TFVARS_MISSION=$(tf_value 'var.mission_name')
        if [ "${TFVARS_MISSION}" != "${MISSION}" ]; then
          echo "MISSION=${MISSION} does not match mission_name=${TFVARS_MISSION} in ${TFVARS}"
          exit 1
        fi

        PF_ECR_REPO=$(tf_value 'var.enable_processing_lambda && var.processing_image_uri_override == "" ? format("%s%s", local.environment_short_name, var.processing_function_private_ecr_name) : ""')
        SF_ECR_REPO=$(tf_value 'var.enable_sorting_lambda && var.sorting_image_uri_override == "" ? format("%s%s", local.environment_short_name, var.sorting_function_private_ecr_name) : ""')
        AF_ECR_REPO=$(tf_value 'var.enable_artifacts_lambda && var.artifacts_image_uri_override == "" ? format("%s%s", local.environment_short_name, var.artifacts_function_private_ecr_name) : ""')
        CF_ECR_REPO=$(tf_value 'var.needs_concating && var.enable_concating_lambda && var.concating_image_uri_override == "" ? format("%s%s", local.environment_short_name, var.concating_function_private_ecr_name) : ""')

        TARGET_RESOURCE=""
        TARGET_IMAGE_VAR=""
        if [ "${IS_IMAGE_DEPLOYMENT}" = true ]; then
          case "${TRIGGERED_PIPELINE}" in
            PROCESSING)
              [ -n "${PF_ECR_REPO}" ] || { echo "TAG was provided for PROCESSING, but processing Lambda image resolution is disabled for ${MISSION}"; exit 1; }
              TARGET_RESOURCE='aws_lambda_function.aws_sdc_processing_lambda_function[0]'
              TARGET_IMAGE_VAR="pf_image_tag=${TAG}"
              ;;
            SORTING)
              [ -n "${SF_ECR_REPO}" ] || { echo "TAG was provided for SORTING, but sorting Lambda image resolution is disabled for ${MISSION}"; exit 1; }
              TARGET_RESOURCE='aws_lambda_function.sorting_lambda_function[0]'
              TARGET_IMAGE_VAR="sf_image_tag=${TAG}"
              ;;
            ARTIFACTS)
              [ -n "${AF_ECR_REPO}" ] || { echo "TAG was provided for ARTIFACTS, but artifacts Lambda image resolution is disabled for ${MISSION}"; exit 1; }
              TARGET_RESOURCE='aws_lambda_function.aws_sdc_artifacts_lambda_function[0]'
              TARGET_IMAGE_VAR="af_image_tag=${TAG}"
              ;;
            CONCATING)
              [ -n "${CF_ECR_REPO}" ] || { echo "TAG was provided for CONCATING, but concating Lambda image resolution is disabled for ${MISSION}"; exit 1; }
              TARGET_RESOURCE='aws_lambda_function.aws_sdc_concating_lambda_function[0]'
              TARGET_IMAGE_VAR="cf_image_tag=${TAG}"
              ;;
            *)
              echo "TAG was provided for unsupported LAMBDA_PIPELINE=${LAMBDA_PIPELINE:-<empty>}"
              exit 1
              ;;
          esac
        fi

        latest_tag() {
          aws ecr describe-images \
            --repository-name "$1" \
            --region "${REGION}" \
            --query "reverse(sort_by(imageDetails[?imageTags != null], &imagePushedAt))[].imageTags[]" \
            --output text | tr '\t' '\n' | awk '$0 != "latest" { print; exit }'
        }

        image_tag_for() {
          LABEL="$1"
          REPO="$2"

          if [ -z "${REPO}" ]; then
            echo ""
            return
          fi

          case "${TRIGGERED_PIPELINE}" in
            "${LABEL}")
              if [ -n "${TAG:-}" ]; then
                echo "${TAG}"
                return
              fi
              ;;
          esac

          latest_tag "${REPO}"
        }

        if [ "${IS_IMAGE_DEPLOYMENT}" = true ]; then
          IMAGE_PLAN=/tmp/pipeline-image.tfplan
          terraform plan \
            -lock-timeout=10m \
            -input=false \
            -out="${IMAGE_PLAN}" \
            -target="${TARGET_RESOURCE}" \
            -var-file="${TFVARS}" \
            -var="${TARGET_IMAGE_VAR}"
          guard_image_plan "${IMAGE_PLAN}" "${TARGET_RESOURCE}"
          terraform apply -lock-timeout=10m -input=false -auto-approve "${IMAGE_PLAN}"
          exit 0
        fi

        PF_IMAGE_TAG=$(image_tag_for PROCESSING "${PF_ECR_REPO}")
        SF_IMAGE_TAG=$(image_tag_for SORTING "${SF_ECR_REPO}")
        AF_IMAGE_TAG=$(image_tag_for ARTIFACTS "${AF_ECR_REPO}")
        CF_IMAGE_TAG=$(image_tag_for CONCATING "${CF_ECR_REPO}")

        TF_IMAGE_VARS=""
        add_image_var() {
          NAME="$1"
          REPO="$2"
          TAG_VALUE="$3"

          if [ -z "${REPO}" ]; then
            return
          fi

          if [ -z "${TAG_VALUE}" ] || [ "${TAG_VALUE}" = "None" ]; then
            echo "Unable to resolve ${NAME} image tag from ECR repo ${REPO}"
            exit 1
          fi

          echo "${NAME}: ${REPO}:${TAG_VALUE}"
          TF_IMAGE_VARS="${TF_IMAGE_VARS} -var ${NAME}=${TAG_VALUE}"
        }

        add_image_var pf_image_tag "${PF_ECR_REPO}" "${PF_IMAGE_TAG}"
        add_image_var sf_image_tag "${SF_ECR_REPO}" "${SF_IMAGE_TAG}"
        add_image_var af_image_tag "${AF_ECR_REPO}" "${AF_IMAGE_TAG}"
        add_image_var cf_image_tag "${CF_ECR_REPO}" "${CF_IMAGE_TAG}"

        terraform apply \
          -lock-timeout=10m \
          -input=false \
          -auto-approve \
          -var-file="${TFVARS}" \
          ${TF_IMAGE_VARS}

  post_build:
    commands:
      - echo "Build completed on $(date)"
