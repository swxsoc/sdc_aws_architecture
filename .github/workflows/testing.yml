# Terraform validation
name: Terraform Validation

on:
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.14.4
    - name: Terraform validate (base)
      working-directory: base-infrastructure-terraform
      run: |
        terraform init -backend=false -input=false
        terraform validate
    - name: Terraform test (base)
      working-directory: base-infrastructure-terraform
      run: |
        if find . -name '*.tftest.hcl' -print -quit | grep -q .; then
          TF_WORKSPACE=default TF_CLI_ARGS_init="-backend=false -input=false" terraform test
        else
          echo "No Terraform tests found."
        fi
    - name: Terraform validate (pipeline)
      working-directory: pipeline-infrastructure-terraform
      run: |
        terraform init -backend=false -input=false
        terraform validate
    - name: Terraform test (pipeline)
      working-directory: pipeline-infrastructure-terraform
      run: |
        if find . -name '*.tftest.hcl' -print -quit | grep -q .; then
          # Production-only resources depend on the workspace name, so the
          # production test file runs under its own prod-* workspace.
          TF_WORKSPACE=dev-test TF_CLI_ARGS_init="-backend=false -input=false" terraform test -filter=basic.tftest.hcl
          TF_WORKSPACE=prod-test TF_CLI_ARGS_init="-backend=false -input=false" terraform test -filter=production.tftest.hcl
        else
          echo "No Terraform tests found."
        fi
    - name: Terraform validate (deployment)
      working-directory: deployment-infrastructure-terraform
      run: |
        terraform init -backend=false -input=false
        terraform validate
    - name: Terraform test (deployment)
      working-directory: deployment-infrastructure-terraform
      run: |
        if find . -name '*.tftest.hcl' -print -quit | grep -q .; then
          TF_CLI_ARGS_init="-backend=false -input=false" terraform test
        else
          echo "No Terraform tests found."
        fi
