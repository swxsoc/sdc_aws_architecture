# Terraform linting and formatting
name: Terraform Linting and Formatting

on:
  pull_request:
    branches:
      - main
jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.14.4
    - uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: latest
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Terraform fmt
      run: terraform fmt -check -recursive
    - name: TFLint (base)
      working-directory: base-infrastructure-terraform
      run: |
        tflint --init
        tflint
    - name: TFLint (pipeline)
      working-directory: pipeline-infrastructure-terraform
      run: |
        tflint --init
        tflint
    - name: TFLint (deployment)
      working-directory: deployment-infrastructure-terraform
      run: |
        tflint --init
        tflint
    - name: Install Python lint tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install ruff
    - name: Ruff format
      run: |
        ruff format --check --diff docs
    - name: Ruff lint
      run: |
        ruff check docs
